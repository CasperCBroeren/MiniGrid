<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F7FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2E8B57;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tower" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A0A0A0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#696969;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D3D3D3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect x="0" y="0" width="400" height="120" fill="url(#sky)" />
  
  <!-- Clouds -->
  <path d="M50,30 Q70,20 90,30 Q100,40 80,40 Q70,50 50,40 Q40,30 50,30" fill="white" opacity="0.8" />
  <path d="M200,50 Q220,40 240,50 Q250,60 230,60 Q220,70 200,60 Q190,50 200,50" fill="white" opacity="0.7" />
  <path d="M300,25 Q320,15 340,25 Q350,35 330,35 Q320,45 300,35 Q290,25 300,25" fill="white" opacity="0.6" />
  
  <!-- Ground -->
  <rect x="0" y="120" width="400" height="80" fill="url(#ground)" />
  
  <!-- Wind turbine 1 -->
  <rect x="80" y="120" width="8" height="80" fill="url(#tower)" />
  <circle cx="84" cy="120" r="20" fill="#696969" />
  
  <!-- Blades for turbine 1 (rotated) -->
  <path d="M84,100 L104,105 L84,110 Z" fill="url(#blade)" stroke="#A0A0A0" stroke-width="0.5" transform="rotate(0, 84, 110)" />
  <path d="M84,100 L64,105 L84,110 Z" fill="url(#blade)" stroke="#A0A0A0" stroke-width="0.5" transform="rotate(0, 84, 110)" />
  <path d="M84,100 L84,80 L84,110 Z" fill="url(#blade)" stroke="#A0A0A0" stroke-width="0.5" transform="rotate(0, 84, 110)" />
  
  <!-- Wind turbine 2 -->
  <rect x="180" y="120" width="8" height="80" fill="url(#tower)" />
  <circle cx="184" cy="120" r="20" fill="#696969" />
  
  <!-- Blades for turbine 2 (rotated 120 degrees) -->
  <path d="M184,100 L204,105 L184,110 Z" fill="url(#blade)" stroke="#A0A0A0" stroke-width="0.5" transform="rotate(120, 184, 110)" />
  <path d="M184,100 L164,105 L184,110 Z" fill="url(#blade)" stroke="#A0A0A0" stroke-width="0.5" transform="rotate(120, 184, 110)" />
  <path d="M184,100 L184,80 L184,110 Z" fill="url(#blade)" stroke="#A0A0A0" stroke-width="0.5" transform="rotate(120, 184, 110)" />
  
  <!-- Wind turbine 3 -->
  <rect x="280" y="120" width="8" height="80" fill="url(#tower)" />
  <circle cx="284" cy="120" r="20" fill="#696969" />
  
  <!-- Blades for turbine 3 (rotated 240 degrees) -->
  <path d="M284,100 L304,105 L284,110 Z" fill="url(#blade)" stroke="#A0A0A0" stroke-width="0.5" transform="rotate(240, 284, 110)" />
  <path d="M284,100 L264,105 L284,110 Z" fill="url(#blade)" stroke="#A0A0A0" stroke-width="0.5" transform="rotate(240, 284, 110)" />
  <path d="M284,100 L284,80 L284,110 Z" fill="url(#blade)" stroke="#A0A0A0" stroke-width="0.5" transform="rotate(240, 284, 110)" />
  
  <!-- Some grass details -->
  <path d="M20,175 Q25,165 30,175" fill="#32CD32" />
  <path d="M60,175 Q65,165 70,175" fill="#32CD32" />
  <path d="M100,175 Q105,165 110,175" fill="#32CD32" />
  <path d="M150,175 Q155,165 160,175" fill="#32CD32" />
  <path d="M200,175 Q205,165 210,175" fill="#32CD32" />
  <path d="M250,175 Q255,165 260,175" fill="#32CD32" />
  <path d="M300,175 Q305,165 310,175" fill="#32CD32" />
  <path d="M350,175 Q355,165 360,175" fill="#32CD32" />
</svg>
