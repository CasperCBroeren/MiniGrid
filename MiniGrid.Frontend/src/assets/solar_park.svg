<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F7FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2E8B57;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A4A4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect x="0" y="0" width="400" height="120" fill="url(#sky)" />
  
  <!-- Sun -->
  <circle cx="350" cy="40" r="25" fill="#FFD700" />
  <circle cx="350" cy="40" r="35" fill="none" stroke="#FFD700" stroke-width="2" stroke-opacity="0.5" />
  
  <!-- Ground -->
  <rect x="0" y="120" width="400" height="80" fill="url(#ground)" />
  
  <!-- Solar panels - Row 1 -->
  <rect x="50" y="130" width="60" height="40" fill="url(#panel)" rx="3" ry="3" />
  <rect x="120" y="130" width="60" height="40" fill="url(#panel)" rx="3" ry="3" />
  <rect x="190" y="130" width="60" height="40" fill="url(#panel)" rx="3" ry="3" />
  <rect x="260" y="130" width="60" height="40" fill="url(#panel)" rx="3" ry="3" />
  
  <!-- Solar panels - Row 2 -->
  <rect x="50" y="145" width="60" height="40" fill="url(#panel)" rx="3" ry="3" />
  <rect x="120" y="145" width="60" height="40" fill="url(#panel)" rx="3" ry="3" />
  <rect x="190" y="145" width="60" height="40" fill="url(#panel)" rx="3" ry="3" />
  <rect x="260" y="145" width="60" height="40" fill="url(#panel)" rx="3" ry="3" />
  
  <!-- Panel frames -->
  <rect x="50" y="130" width="60" height="40" fill="none" stroke="#666" stroke-width="2" rx="3" ry="3" />
  <rect x="120" y="130" width="60" height="40" fill="none" stroke="#666" stroke-width="2" rx="3" ry="3" />
  <rect x="190" y="130" width="60" height="40" fill="none" stroke="#666" stroke-width="2" rx="3" ry="3" />
  <rect x="260" y="130" width="60" height="40" fill="none" stroke="#666" stroke-width="2" rx="3" ry="3" />
  <rect x="50" y="145" width="60" height="40" fill="none" stroke="#666" stroke-width="2" rx="3" ry="3" />
  <rect x="120" y="145" width="60" height="40" fill="none" stroke="#666" stroke-width="2" rx="3" ry="3" />
  <rect x="190" y="145" width="60" height="40" fill="none" stroke="#666" stroke-width="2" rx="3" ry="3" />
  <rect x="260" y="145" width="60" height="40" fill="none" stroke="#666" stroke-width="2" rx="3" ry="3" />
  
  <!-- Panel details (grid lines) -->
  <line x1="70" y1="130" x2="70" y2="170" stroke="#888" stroke-width="0.5" />
  <line x1="90" y1="130" x2="90" y2="170" stroke="#888" stroke-width="0.5" />
  <line x1="140" y1="130" x2="140" y2="170" stroke="#888" stroke-width="0.5" />
  <line x1="160" y1="130" x2="160" y2="170" stroke="#888" stroke-width="0.5" />
  <line x1="210" y1="130" x2="210" y2="170" stroke="#888" stroke-width="0.5" />
  <line x1="230" y1="130" x2="230" y2="170" stroke="#888" stroke-width="0.5" />
  <line x1="280" y1="130" x2="280" y2="170" stroke="#888" stroke-width="0.5" />
  <line x1="300" y1="130" x2="300" y2="170" stroke="#888" stroke-width="0.5" />
  
  <!-- Some small grass details -->
  <path d="M20,175 Q25,165 30,175" fill="#32CD32" />
  <path d="M80,175 Q85,165 90,175" fill="#32CD32" />
  <path d="M150,175 Q155,165 160,175" fill="#32CD32" />
  <path d="M220,175 Q225,165 230,175" fill="#32CD32" />
  <path d="M290,175 Q295,165 300,175" fill="#32CD32" />
  <path d="M360,175 Q365,165 370,175" fill="#32CD32" />
</svg>
